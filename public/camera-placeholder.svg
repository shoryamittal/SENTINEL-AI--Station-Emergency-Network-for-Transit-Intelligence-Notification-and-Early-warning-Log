<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="50%" stop-color="#08101a"/>
      <stop offset="100%" stop-color="#0c192c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 255, 136, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Scanning Line -->
  <g>
    <line x1="0" y1="0" x2="640" y2="0" stroke="url(#scanGrad)" stroke-width="2.5">
      <animate attributeName="y1" values="15;345;15" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="15;345;15" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Camera Outer Reticle Frame -->
  <rect x="16" y="16" width="608" height="328" rx="8" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.2" stroke-dasharray="12 6"/>
  
  <!-- Reticle Crosshair in Center -->
  <circle cx="320" cy="180" r="48" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.5">
    <animate attributeName="r" values="44;52;44" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="180" r="3" fill="#00f0ff"/>
  <line x1="320" y1="120" x2="320" y2="148" stroke="#00f0ff" stroke-width="2"/>
  <line x1="320" y1="212" x2="320" y2="240" stroke="#00f0ff" stroke-width="2"/>
  <line x1="260" y1="180" x2="288" y2="180" stroke="#00f0ff" stroke-width="2"/>
  <line x1="352" y1="180" x2="380" y2="180" stroke="#00f0ff" stroke-width="2"/>

  <!-- Animated Target 1 (Moving Person) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-15,0; 25,-10; -15,0" dur="4.5s" repeatCount="indefinite"/>
    <circle cx="210" cy="190" r="45" fill="url(#targetGlow)"/>
    <rect x="180" y="130" width="60" height="120" rx="4" fill="none" stroke="#00ff88" stroke-width="2"/>
    <line x1="180" y1="130" x2="192" y2="130" stroke="#00f0ff" stroke-width="3"/>
    <line x1="180" y1="130" x2="180" y2="142" stroke="#00f0ff" stroke-width="3"/>
    <line x1="240" y1="250" x2="228" y2="250" stroke="#00f0ff" stroke-width="3"/>
    <line x1="240" y1="250" x2="240" y2="238" stroke="#00f0ff" stroke-width="3"/>
    <rect x="180" y="112" width="76" height="18" rx="2" fill="#07121c" stroke="#00ff88" stroke-width="1.2"/>
    <text x="185" y="125" fill="#00ff88" font-family="monospace, Courier" font-size="9" font-weight="900" letter-spacing="0.5">PERSON 96%</text>
  </g>

  <!-- Animated Target 2 (Moving Person) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="10,0; -30,12; 10,0" dur="5.2s" repeatCount="indefinite"/>
    <rect x="380" y="140" width="58" height="115" rx="4" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <line x1="380" y1="140" x2="392" y2="140" stroke="#00ff88" stroke-width="3"/>
    <line x1="380" y1="140" x2="380" y2="152" stroke="#00ff88" stroke-width="3"/>
    <line x1="438" y1="255" x2="426" y2="255" stroke="#00ff88" stroke-width="3"/>
    <line x1="438" y1="255" x2="438" y2="243" stroke="#00ff88" stroke-width="3"/>
    <rect x="380" y="122" width="76" height="18" rx="2" fill="#07121c" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="385" y="135" fill="#00f0ff" font-family="monospace, Courier" font-size="9" font-weight="900" letter-spacing="0.5">PERSON 93%</text>
  </g>

  <!-- Top Header HUD -->
  <rect x="25" y="24" width="590" height="34" rx="4" fill="rgba(6, 12, 22, 0.85)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
  <circle cx="42" cy="41" r="5" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="45" fill="#00f0ff" font-family="monospace, Courier" font-size="11" font-weight="800" letter-spacing="1.5">● LIVE STREAM · YOLOv8s DETECTION ACTIVE</text>
  <text x="595" y="45" text-anchor="end" fill="#00ff88" font-family="monospace, Courier" font-size="11" font-weight="800">30.0 FPS</text>

  <!-- Bottom Telemetry HUD -->
  <rect x="25" y="306" width="590" height="30" rx="4" fill="rgba(6, 12, 22, 0.85)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
  <text x="38" y="325" fill="#94a3b8" font-family="monospace, Courier" font-size="9.5" font-weight="700">CAMERA: PLATFORM 1 · SECTOR: CONCOURSE · AI LATENCY: 14.2ms</text>
  <text x="595" y="325" text-anchor="end" fill="#00f0ff" font-family="monospace, Courier" font-size="9.5" font-weight="800">TARGET: PERSON (COCO-0)</text>
</svg>
